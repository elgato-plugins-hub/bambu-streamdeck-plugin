<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Bambu Connect Configuration</title>
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #d8dce6;
            background-color: #2d2d2d;
            margin: 0;
            padding: 12px;
            font-size: 12px;
        }

        .card {
            background: #232429;
            border: 1px solid #363942;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .card-title {
            font-weight: 600;
            font-size: 13px;
            color: #00ae42;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: #9da4b4;
            font-size: 11px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            box-sizing: border-box;
            background: #18191c;
            border: 1px solid #3a3d47;
            color: #ffffff;
            padding: 7px 10px;
            border-radius: 5px;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #00ae42;
        }

        .btn {
            background: #00ae42;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn:hover {
            background: #008f36;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #3a3d47;
            margin-top: 6px;
        }

        .btn-secondary:hover {
            background: #4a4e5c;
        }

        .btn-danger {
            background: #3f1d1d;
            color: #f87171;
            border: 1px solid #7f1d1d;
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-danger:hover {
            background: #5c2828;
        }

        .status-msg {
            margin-top: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            display: none;
        }

        .status-msg.info {
            background: #1e3a29;
            color: #4ade80;
            border: 1px solid #22543d;
            display: block;
        }

        .status-msg.error {
            background: #3f1d1d;
            color: #f87171;
            border: 1px solid #7f1d1d;
            display: block;
        }

        .hidden {
            display: none !important;
        }

        .user-badge {
            background: #18191c;
            border: 1px solid #2a2d36;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #4ade80;
        }

        .toggle-manual {
            color: #8a92a1;
            font-size: 11px;
            text-align: center;
            margin-top: 10px;
            cursor: pointer;
            text-decoration: underline;
        }

        .toggle-manual:hover {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- AMS OPTIONS (only for the AMS slot, overview and external spool keys) -->
    <div id="amsOptions" class="card hidden">
        <div id="amsUnitGroup" class="form-group hidden">
            <label for="amsUnitSelect" data-i18n="AMS Unit">AMS Unit</label>
            <select id="amsUnitSelect">
                <option value="0">AMS A</option>
                <option value="1">AMS B</option>
                <option value="2">AMS C</option>
                <option value="3">AMS D</option>
                <option value="128">AMS HT 1</option>
                <option value="129">AMS HT 2</option>
                <option value="130">AMS HT 3</option>
                <option value="131">AMS HT 4</option>
            </select>
        </div>
        <div id="externalGroup" class="form-group hidden">
            <label for="externalSelect" data-i18n="External Spool">External Spool</label>
            <select id="externalSelect">
                <option value="0" data-i18n="Spool 1">Spool 1</option>
                <option value="1" data-i18n="Spool 2">Spool 2</option>
            </select>
        </div>
        <div id="overviewHint" class="status-msg info hidden" data-i18n="Press the key to switch between AMS units.">Press the key to switch between AMS units.</div>
    </div>

    <!-- MODE 1: LOGIN FORM (IF NO GLOBAL LOGIN) -->
    <div id="loginSection" class="card">
        <div class="card-title">
            <div class="card-title-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                    <polyline points="10 17 15 12 10 7"></polyline>
                    <line x1="15" y1="12" x2="3" y2="12"></line>
                </svg>
                <span data-i18n="Sign In to Bambu Cloud">Sign In to Bambu Cloud</span>
            </div>
        </div>

        <div class="form-group">
            <label for="region" data-i18n="Account Region">Account Region</label>
            <select id="region">
                <option value="us">Global / Europe / America (US)</option>
                <option value="cn">China (CN)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="account" data-i18n="Bambu Lab Account Email">Bambu Lab Account Email</label>
            <input type="text" id="account" placeholder="user@example.com" autocomplete="username" />
        </div>

        <div class="form-group">
            <label for="password" data-i18n="Password">Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <!-- 2FA FIELD -->
        <div id="tfaGroup" class="form-group hidden">
            <label id="tfaLabel" for="tfaCode" data-i18n="Verification Code">Verification Code</label>
            <input type="text" id="tfaCode" placeholder="e.g. 123456" data-i18n-placeholder="e.g. 123456" />
        </div>

        <button id="btnLogin" class="btn" type="button" data-i18n="Sign In">Sign In</button>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- MODE 2: LOGGED IN (PRINTER SELECTION) -->
    <div id="loggedInSection" class="card hidden">
        <div class="card-title">
            <div class="card-title-left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span data-i18n="Bambu Account Connected">Bambu Account Connected</span>
            </div>
            <button id="btnLogout" class="btn-danger" type="button" data-i18n="Sign Out">Sign Out</button>
        </div>

        <div class="user-badge">
            <span id="userAccountText">user@bambulab.com</span>
            <span data-i18n="✓ Globally Connected">✓ Globally Connected</span>
        </div>

        <div class="form-group">
            <label for="deviceSelect" data-i18n="Select Printer for this Key">Select Printer for this Key</label>
            <select id="deviceSelect">
                <option value="" data-i18n="Loading printers...">Loading printers...</option>
            </select>
        </div>

        <button id="btnReloadDevices" class="btn btn-secondary" type="button" data-i18n="🔄 Refresh Printer List">🔄 Refresh Printer List</button>

        <div class="form-group" style="margin-top:12px">
            <label for="manualSerial" data-i18n="Or enter printer serial manually">Or enter printer serial manually</label>
            <input type="text" id="manualSerial" placeholder="e.g. 22E00A123456" data-i18n-placeholder="e.g. 22E00A123456" autocomplete="off" />
        </div>
        <div class="form-group">
            <label for="manualUserId" data-i18n="Bambu User ID (needed if the printer list is blocked)">Bambu User ID (needed if the printer list is blocked)</label>
            <input type="text" id="manualUserId" placeholder="e.g. u_1234567890 or 1234567890" data-i18n-placeholder="e.g. u_1234567890 or 1234567890" autocomplete="off" />
        </div>
        <button id="btnSaveSerial" class="btn btn-secondary" type="button" data-i18n="Use This Serial / User ID">Use This Serial / User ID</button>
        <div id="loggedInStatusMsg" class="status-msg"></div>
    </div>

    <!-- MANUAL / ADVANCED MODE -->
    <div id="manualSection" class="card hidden">
        <div class="card-title">
            <span data-i18n="⚙️ Advanced Manual Settings">⚙️ Advanced Manual Settings</span>
        </div>
        <sdpi-item label="Print Usage Hours" data-i18n-label="Print Usage Hours">
            <sdpi-textfield setting="initialHours" placeholder="e.g. 142 (Optional)" data-i18n-placeholder="e.g. 142 (Optional)"></sdpi-textfield>
        </sdpi-item>
        <sdpi-item label="Bambu JWT Token" data-i18n-label="Bambu JWT Token">
            <sdpi-textfield setting="userToken" type="password" placeholder="Paste JWT token" data-i18n-placeholder="Paste JWT token"></sdpi-textfield>
        </sdpi-item>
        <sdpi-item label="Serial Number" data-i18n-label="Serial Number">
            <sdpi-textfield setting="deviceSerial" placeholder="e.g. 22E00A123456" data-i18n-placeholder="e.g. 22E00A123456"></sdpi-textfield>
        </sdpi-item>
        <sdpi-item label="Region" data-i18n-label="Region">
            <sdpi-select setting="region" default="us">
                <option value="us">US / EU</option>
                <option value="cn">China</option>
            </sdpi-select>
        </sdpi-item>
    </div>

    <div class="toggle-manual" id="toggleManual" data-i18n="View Advanced Manual Settings">View Advanced Manual Settings</div>

    <script src="i18n.js"></script>
    <script>
        let websocket = null;
        let pluginUUID = null;
        let currentActionInfo = null;
        let currentSettings = {};
        let globalSettings = {};
        let activeLoginState = null;

        const loginSectionEl = document.getElementById("loginSection");
        const loggedInSectionEl = document.getElementById("loggedInSection");
        const userAccountTextEl = document.getElementById("userAccountText");
        const btnLogoutEl = document.getElementById("btnLogout");

        const regionEl = document.getElementById("region");
        const accountEl = document.getElementById("account");
        const passwordEl = document.getElementById("password");
        const tfaGroupEl = document.getElementById("tfaGroup");
        const tfaLabelEl = document.getElementById("tfaLabel");
        const tfaCodeEl = document.getElementById("tfaCode");
        const btnLoginEl = document.getElementById("btnLogin");
        const statusMsgEl = document.getElementById("statusMsg");
        const loggedInStatusMsgEl = document.getElementById("loggedInStatusMsg");

        const deviceSelectEl = document.getElementById("deviceSelect");
        const btnReloadDevicesEl = document.getElementById("btnReloadDevices");

        const manualSectionEl = document.getElementById("manualSection");
        const toggleManualEl = document.getElementById("toggleManual");

        toggleManualEl.addEventListener("click", () => {
            manualSectionEl.classList.toggle("hidden");
        });

        function showStatus(msg, isError = false, targetEl = statusMsgEl) {
            targetEl.innerText = msg;
            targetEl.className = "status-msg " + (isError ? "error" : "info");
        }

        function sendToPlugin(payload) {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                const json = {
                    event: "sendToPlugin",
                    action: currentActionInfo.action,
                    context: pluginUUID,
                    payload: payload
                };
                websocket.send(JSON.stringify(json));
            }
        }

        function saveSettings(newSettings) {
            currentSettings = { ...currentSettings, ...newSettings };
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                const json = {
                    event: "setSettings",
                    context: pluginUUID,
                    payload: currentSettings
                };
                websocket.send(JSON.stringify(json));
            }
        }

        const amsOptionsEl = document.getElementById("amsOptions");
        const amsUnitGroupEl = document.getElementById("amsUnitGroup");
        const amsUnitSelectEl = document.getElementById("amsUnitSelect");
        const externalGroupEl = document.getElementById("externalGroup");
        const externalSelectEl = document.getElementById("externalSelect");
        const overviewHintEl = document.getElementById("overviewHint");

        function updateAmsOptions() {
            const action = (currentActionInfo && currentActionInfo.action) || "";
            const isSlot = /\.ams-slot-\d$/.test(action);
            const isExternal = /\.ams-external$/.test(action);
            const isOverview = /\.ams-status$/.test(action);
            amsOptionsEl.classList.toggle("hidden", !(isSlot || isExternal || isOverview));
            amsUnitGroupEl.classList.toggle("hidden", !isSlot);
            externalGroupEl.classList.toggle("hidden", !isExternal);
            overviewHintEl.classList.toggle("hidden", !isOverview);
            amsUnitSelectEl.value = String(currentSettings.amsUnit || "0");
            externalSelectEl.value = String(currentSettings.externalIndex || "0");
        }

        amsUnitSelectEl.addEventListener("change", (e) => saveSettings({ amsUnit: e.target.value }));
        externalSelectEl.addEventListener("change", (e) => saveSettings({ externalIndex: e.target.value }));

        function updateUIState() {
            updateAmsOptions();
            const token = currentSettings.userToken || globalSettings.userToken;
            const email = currentSettings.accountEmail || globalSettings.accountEmail;

            if (token) {
                loginSectionEl.classList.add("hidden");
                loggedInSectionEl.classList.remove("hidden");
                userAccountTextEl.innerText = email || t("Bambu Lab Account");
            } else {
                loginSectionEl.classList.remove("hidden");
                loggedInSectionEl.classList.add("hidden");
            }
        }

        btnLoginEl.addEventListener("click", () => {
            const region = regionEl.value;
            const account = accountEl.value.trim();
            const password = passwordEl.value;
            const tfaCode = tfaCodeEl.value.trim();

            if (!account || !password) {
                showStatus(t("Please enter your email and password"), true);
                return;
            }

            btnLoginEl.disabled = true;

            if (activeLoginState) {
                showStatus(t("Verifying code..."));
                sendToPlugin({
                    event: "verifyCode",
                    region,
                    account,
                    code: tfaCode,
                    loginType: activeLoginState.loginType,
                    tfaKey: activeLoginState.tfaKey
                });
            } else {
                showStatus(t("Signing in to Bambu Cloud..."));
                sendToPlugin({
                    event: "login",
                    region,
                    account,
                    password
                });
            }
        });

        btnLogoutEl.addEventListener("click", () => {
            currentSettings = {};
            globalSettings = {};
            saveSettings({
                userToken: "",
                deviceSerial: "",
                accountEmail: ""
            });
            sendToPlugin({ event: "logout" });
            updateUIState();
        });

        btnReloadDevicesEl.addEventListener("click", () => {
            const token = currentSettings.userToken || globalSettings.userToken;
            if (token) {
                showStatus(t("Loading printers..."), false, loggedInStatusMsgEl);
                sendToPlugin({
                    event: "fetchDevices",
                    region: globalSettings.region || regionEl.value || "us",
                    token: token
                });
            }
        });

        function applySerial(serial, userId) {
            const extra = userId ? { userId } : {};
            saveSettings({
                deviceSerial: serial,
                ...extra
            });
            globalSettings = { ...globalSettings, deviceSerial: serial, ...extra };
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                const reqGlobals = {
                    event: "setGlobalSettings",
                    context: pluginUUID,
                    payload: globalSettings
                };
                websocket.send(JSON.stringify(reqGlobals));
            }
            showStatus(t("Printer saved! The key will now update."), false, loggedInStatusMsgEl);
        }

        deviceSelectEl.addEventListener("change", (e) => {
            const serial = e.target.value;
            if (serial) applySerial(serial);
        });

        document.getElementById("btnSaveSerial").addEventListener("click", () => {
            const serial = document.getElementById("manualSerial").value.trim().toUpperCase();
            if (!/^[A-Z0-9]{10,20}$/.test(serial)) {
                showStatus(t("Enter a valid printer serial (letters and digits, no spaces)."), true, loggedInStatusMsgEl);
                return;
            }
            const userId = document.getElementById("manualUserId").value.trim();
            if (userId && !/^(u_)?\d{4,}$/i.test(userId)) {
                showStatus(t("User ID should be digits only, optionally starting with u_."), true, loggedInStatusMsgEl);
                return;
            }
            applySerial(serial, userId);
        });

        function populateDevices(devices) {
            deviceSelectEl.innerHTML = "";
            if (!devices || devices.length === 0) {
                deviceSelectEl.innerHTML = "";
                const none = document.createElement("option");
                none.value = "";
                none.innerText = t("No printers found in your account");
                deviceSelectEl.appendChild(none);
                return;
            }

            const defaultOpt = document.createElement("option");
            defaultOpt.value = "";
            defaultOpt.innerText = t("-- Select printer for this key --");
            deviceSelectEl.appendChild(defaultOpt);

            devices.forEach(d => {
                const opt = document.createElement("option");
                opt.value = d.dev_id;
                opt.innerText = `${d.name} (${d.dev_product_name}) - ${d.dev_id}`;
                const activeSerial = currentSettings.deviceSerial || globalSettings.deviceSerial;
                if (activeSerial === d.dev_id) {
                    opt.selected = true;
                }
                deviceSelectEl.appendChild(opt);
            });
        }

        window.connectElgatoStreamDeckSocket = function(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
            pluginUUID = inPropertyInspectorUUID;
            initI18n(inInfo);
            currentActionInfo = JSON.parse(inActionInfo);
            currentSettings = currentActionInfo.payload.settings || {};

            websocket = new WebSocket("ws://127.0.0.1:" + inPort);

            websocket.onopen = function() {
                const register = {
                    event: inRegisterEvent,
                    uuid: inPropertyInspectorUUID
                };
                websocket.send(JSON.stringify(register));

                const reqGlobals = {
                    event: "getGlobalSettings",
                    context: pluginUUID
                };
                websocket.send(JSON.stringify(reqGlobals));
            };

            websocket.onmessage = function(evt) {
                const jsonObj = JSON.parse(evt.data);
                const event = jsonObj.event;
                const payload = jsonObj.payload;

                if (event === "didReceiveSettings") {
                    currentSettings = payload.settings || {};
                    updateUIState();
                } else if (event === "didReceiveGlobalSettings") {
                    globalSettings = payload.settings || {};
                    updateUIState();
                    const token = currentSettings.userToken || globalSettings.userToken;
                    if (token) {
                        sendToPlugin({
                            event: "fetchDevices",
                            region: globalSettings.region || "us",
                            token: token
                        });
                    }
                } else if (event === "sendToPropertyInspector") {
                    btnLoginEl.disabled = false;

                    if (payload.event === "loginResult") {
                        if (payload.success) {
                            activeLoginState = null;
                            tfaGroupEl.classList.add("hidden");
                            const firstDevice = payload.devices && payload.devices.length > 0 ? payload.devices[0].dev_id : "";
                            globalSettings = {
                                userToken: payload.token,
                                accountEmail: accountEl.value,
                                region: regionEl.value,
                                deviceSerial: firstDevice
                            };
                            saveSettings({
                                deviceSerial: firstDevice
                            });
                            updateUIState();
                            showStatus(t("Login successful! Select your printer below."), false, loggedInStatusMsgEl);
                            populateDevices(payload.devices);
                        } else if (payload.loginType) {
                            activeLoginState = { loginType: payload.loginType, tfaKey: payload.tfaKey };
                            tfaGroupEl.classList.remove("hidden");
                            tfaLabelEl.innerText = payload.loginType === "verifyCode" ? t("Code sent to your Email") : t("TOTP Code from your App");
                            btnLoginEl.innerText = t("Verify Code");
                            showStatus(payload.error || t("Enter code to continue."), true);
                        } else {
                            showStatus(payload.error || t("Login error"), true);
                        }
                    } else if (payload.event === "devicesResult") {
                        if (payload.success) {
                            populateDevices(payload.devices);
                        } else {
                            showStatus(t("Could not fetch the printer list ({0}). Enter your printer serial below instead.", String(payload.error).split("\n")[0].slice(0, 80)), true, loggedInStatusMsgEl);
                        }
                    }
                }
            };
        };
    </script>
</body>

</html>
